name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Finder.Tests/Finder.Tests.csproj

      - name: Test
        run: >
          dotnet test Finder.Tests/Finder.Tests.csproj -c Release --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Finder.sln

      - name: Build
        run: dotnet build Finder.sln -c Release --no-restore

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish Finder.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o publish/framework-dependent

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish Finder.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/self-contained

      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finder-framework-dependent-win-x64
          path: publish/framework-dependent/Finder.exe
          if-no-files-found: error

      - name: Upload self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finder-self-contained-win-x64
          path: publish/self-contained/Finder.exe
          if-no-files-found: error

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Both publishes produce "Finder.exe"; give each a unique, versioned name
          # so one does not overwrite the other as a release asset.
          $tag = "${{ github.ref_name }}"
          Copy-Item publish/framework-dependent/Finder.exe "publish/Finder-$tag-framework-dependent-win-x64.exe"
          Copy-Item publish/self-contained/Finder.exe "publish/Finder-$tag-self-contained-win-x64.exe"

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            publish/Finder-*-framework-dependent-win-x64.exe
            publish/Finder-*-self-contained-win-x64.exe
